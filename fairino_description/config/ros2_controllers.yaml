# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    left_arm_controller:
      type: position_controllers/JointGroupPositionController

    right_arm_controller:
      type: position_controllers/JointGroupPositionController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

left_arm_controller:
  ros__parameters:
    joints:
      - left_joint1
      - left_joint2
      - left_joint3
      - left_joint4
      - left_joint5
      - left_joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
    initial_positions:
      left_joint1: -0.1693
      left_joint2: 0.2543
      left_joint3: -0.2586
      left_joint4: 0.0
      left_joint5: 0.0
      left_joint6: 0.0

right_arm_controller:
  ros__parameters:
    joints:
      - right_joint1
      - right_joint2
      - right_joint3
      - right_joint4
      - right_joint5
      - right_joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
    initial_positions:
      right_joint1: 0.1539
      right_joint2: 0.2726
      right_joint3: -0.2163
      right_joint4: 0.0
      right_joint5: 0.0
      right_joint6: 0.0
